name: Real FFmpeg production editor tests

on:
  pull_request:
    paths:
      - "twitch_gta6_cloud_starter/**"
      - ".github/workflows/ffmpeg-render-test.yml"

jobs:
  media-test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: twitch_gta6_cloud_starter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Install application libraries
        run: pip install -r requirements.txt
      - name: Real synthetic-source FFmpeg and input edge-case tests
        run: |
          python -m unittest discover -s tests -p 'test_integrity_short_editor.py' -v
